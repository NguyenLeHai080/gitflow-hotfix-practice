<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gitflow & Hotfix Practice - Homepage</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0284c7;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Chào mừng đến với Homepage</h1>
    <p>Trang chủ được triển khai thông qua quy trình chuẩn Gitflow: <code>feat/homepage</code> ➔ <code>dev</code> ➔ <code>staging</code> ➔ <code>prod</code>.</p>
    <button class="btn" id="loginBtn" onclick="handleLogin()">Đăng nhập</button>
  </div>

  <script>
    function handleLogin() {
      // BUG: Nhầm lẫn endpoint localhost nội bộ chưa sửa gây lỗi 500/Connection Refused trên Production!
      const authEndpoint = "http://localhost:9999/debug/broken-auth";
      console.log("Gửi yêu cầu đăng nhập tới:", authEndpoint);
      alert("Đang kết nối tới: " + authEndpoint);
    }
  </script>
</body>
</html>
